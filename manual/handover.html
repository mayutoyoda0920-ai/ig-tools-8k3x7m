<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ignis 引き継ぎ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=M+PLUS+1p:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <a class="brand" href="index.html">ignis manual<small>KAMAKURA STAFF</small></a>
  <span class="header-spacer"></span>
  <a class="header-link" href="index.html">← マニュアル</a>
</header>

<main>
  <h1 class="section-title">引き継ぎ</h1>

  <!-- 最新の引き継ぎ -->
  <section class="latest-card" id="latest-wrap" hidden>
    <div class="latest-head">
      <span class="latest-badge">最新の引き継ぎ</span>
      <button type="button" class="btn ghost small" id="refresh-btn">更新</button>
    </div>
    <div id="latest-body"></div>
    <button type="button" class="btn ghost" id="ack-btn" hidden>確認しました</button>
  </section>
  <div class="load-status" id="latest-status" hidden></div>

  <div class="load-status error" id="not-configured" hidden>
    スプレッドシート連携が未設定です。管理者に連絡してください（設定：<code>js/config.js</code>）。
  </div>

  <!-- 引き継ぎを書く -->
  <h2 class="sub-h">引き継ぎを書く</h2>
  <div class="form-card">
    <div class="field-grid">
      <label class="field">
        <span class="field-label">日付</span>
        <input type="date" id="f-date">
      </label>
      <label class="field">
        <span class="field-label">担当（自分）</span>
        <input type="text" id="f-from" placeholder="氏名">
      </label>
      <label class="field field-wide">
        <span class="field-label">次の人（宛名）<span class="hint">— 名前を入れると「@名前」で送ります</span></span>
        <input type="text" id="f-to" placeholder="例：さや（空でもOK）">
      </label>
      <label class="field field-wide">
        <span class="field-label">申し送り</span>
        <textarea id="f-body" rows="5" placeholder="在庫・仕込み・お客様の予約・トラブル・小口の状況など"></textarea>
      </label>
      <label class="field field-wide">
        <span class="field-label">未完了・注意すること</span>
        <textarea id="f-todo" rows="3" placeholder="次の人にやってほしいこと・気をつけること"></textarea>
      </label>
    </div>

    <div class="form-actions">
      <div class="sheets-status" id="status"></div>
      <button type="button" class="btn ghost" id="save-btn">保存だけ</button>
      <button type="button" class="btn" id="save-line-btn">保存してLINEで送る</button>
    </div>
  </div>

  <p class="form-note">
    「保存してLINEで送る」を押すと、内容がスプレッドシートに保存され、そのままLINEが定型文つきで開きます。
    <strong>グループLINEを選んで送信</strong>してください（自動送信ではありません）。
  </p>
</main>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/sheets.js"></script>
<script src="js/handover.js"></script>
</body>
</html>
